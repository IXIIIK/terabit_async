version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: torgi_lots
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  parser:
    build: .
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=qwerty
      - DB_NAME=torgi_lots
    volumes:
      - .:/app

volumes:
  db_data:
